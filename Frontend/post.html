<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wafffle</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <section class="navigation">
        <nav class="nav-bar" id="navBar">
            <div class="fluid-container">
                <a class="brand" href="index.html">
                    Wafffle
                </a>
                <button type="button" id="navToggle" class="nav-toggle" toggle="collapsible" target="#navCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="toggle-icon"></span>
                </button>
                <div id="navCollapse" class="collapsible nav-collapse">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link button-link" href="post.html">
                                New Post
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </section>


    <section class="body">

        <!-- Create New Post Form -->
        <div class="form">
            <form action="/post" method="POST">
                <input id="title" class="blog-input" name="title" placeholder="Title" value="">
                <textarea class="blog-input" name="body" placeholder="Body" value=""></textarea>
                <button type="submit" class="submit-btn">
                    Post
                </button>
            </form>
        </div>
    </section>


    <section class="footer">
        <div class="container">
            <footer class="flex-container">
                <p class="copyright">
                    © 2026
                </p>

                <p class="brand">
                    Wafffle
                </p>
                <ul class="nav-list">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link button-link" href="post.html">
                            New Post
                        </a>
                    </li>
                </ul>
            </footer>
        </div>
    </section>

    <script src="index.js"></script>
</body>
</html>
